version: '3.8'

services:
  # Container do Banco de Dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: take_a_ride_db
    restart: always
    environment:
      POSTGRES_DB: take_a_ride
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Container da API NestJS
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: take_a_ride_api
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: take_a_ride_secret_key_df_2026_super_secure_token

      # URL Completa do Banco
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/take_a_ride

      # ⚡ Variáveis individuais exigidas pelo ConfigService (DatabaseService)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: take_a_ride

      # Mapeamento caso seu configuration-factory (ex: database.config.ts) utilize namespaces:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgrespassword
      DATABASE_NAME: take_a_ride
    depends_on:
      - postgres

volumes:
  postgres_data:
